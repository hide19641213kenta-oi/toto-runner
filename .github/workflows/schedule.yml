name: Toto Auto Fetcher Schedule

on:
  schedule:
    # 毎週土曜日・日曜日の朝8時(JST)に自動起動
    - cron: '0 23 * * 5,6'
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4  # @v3 から @v4 に更新

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5  # @v4 から @v5 に更新
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pythonスクリプトの全自動実行
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python toto_cloud_fetcher.py
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python toto_cloud_fetcher.py
