name: Toto Auto Fetcher Schedule

on:
  schedule:
    # 毎週土曜日・日曜日の朝8時(JST)に自動起動
    # ※ GitHub ActionsはUTC時間基準のため JST 08:00 = UTC 23:00 (前日)
    - cron: '0 23 * * 5,6'
  workflow_dispatch: # GitHub画面からボタン手動実行を可能にする設定

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pythonスクリプトの全自動実行
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python toto_cloud_fetcher.py
